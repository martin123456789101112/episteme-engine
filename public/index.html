<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episteme Engine</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; margin: 0; padding: 20px; position: relative; }
    .author-badge { position: absolute; top: 15px; right: 20px; font-size: 0.8rem; color: #94a3b8; background: #1e293b; padding: 6px 12px; border-radius: 6px; border: 1px solid #334155; }
    h1 { text-align: center; color: #38bdf8; margin: 0 0 5px 0; font-size: 1.8rem; }
    p.subtitle { text-align: center; color: #94a3b8; margin: 0 0 20px 0; font-size: 0.95rem; }
    .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
    input { padding: 12px 16px; width: 420px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
    button { padding: 12px 24px; background: #38bdf8; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #0f172a; }
    .app-layout { display: flex; gap: 15px; width: 100%; height: 75vh; }
    #network { flex: 1; border: 1px solid #334155; border-radius: 8px; background: #0b0f19; height: 100%; }
    .task-panel { width: 380px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .task-panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 4px; }
    .task-panel h2 { color: #38bdf8; font-size: 1.1rem; margin: 0; }
    .task-panel .sub-tag { font-size: 0.8rem; color: #94a3b8; }
    .philosopher-card { background: #0f172a; border-left: 4px solid #38bdf8; padding: 10px 12px; border-radius: 4px; font-size: 0.85rem; line-height: 1.4; margin-bottom: 8px; }
    .philosopher-card strong { color: #f8fafc; display: block; margin-bottom: 3px; font-size: 0.9rem; }
    div.vis-tooltip { position: absolute !important; background-color: #1e293b !important; color: #f8fafc !important; border: 1px solid #38bdf8 !important; border-radius: 8px !important; padding: 12px !important; font-size: 0.85rem !important; max-width: 260px !important; z-index: 9999 !important; }
  </style>
</head>
<body>

  <div class="author-badge">sepulveda celeita martin santiago</div>
  <h1>EPISTEME ENGINE</h1>
  <p class="subtitle">Simulador de la Teoría del Conocimiento mediante Nodos Interactivos</p>

  <div class="controls">
    <input type="text" id="userInput" value="Veo una manzana roja en la mesa">
    <button onclick="procesarEpistemologia()">Analizar en Nodos</button>
  </div>

  <div class="app-layout">
    <div id="network"></div>
    <div class="task-panel">
      <div class="task-panel-header">
        <h2>Respuesta de la Tarea</h2>
        <span class="sub-tag">(Informe)</span>
      </div>
      <div id="taskContent"><p style="color: #94a3b8;">Cargando análisis...</p></div>
    </div>
  </div>

  <script>
    let network = null;

    function formatearTooltip(texto) {
      const container = document.createElement('div');
      container.style.maxWidth = '240px';
      container.style.whiteSpace = 'normal';
      container.style.wordWrap = 'break-word';
      container.innerText = texto || 'Cargando...';
      return container;
    }

    function acortarTextoNodo(str, maxLen = 30) {
      return str.length <= maxLen ? str : str.substring(0, maxLen) + '...';
    }

    async function procesarEpistemologia() {
      const premisa = document.getElementById('userInput').value;

      try {
        const response = await fetch('/api/analizar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ premisa })
        });

        const data = await response.json();

        const listaFilosofos = [
          { key: 'socrates', name: 'Sócrates', color: '#38bdf8', era: 'Antigua' },
          { key: 'platon', name: 'Platón', color: '#38bdf8', era: 'Antigua' },
          { key: 'aristoteles', name: 'Aristóteles', color: '#38bdf8', era: 'Antigua' },
          { key: 'agustin', name: 'San Agustín', color: '#a855f7', era: 'Medieval' },
          { key: 'escoto', name: 'Duns Escoto', color: '#a855f7', era: 'Medieval' },
          { key: 'ockam', name: 'Guillermo de Ockham', color: '#a855f7', era: 'Medieval' },
          { key: 'descartes', name: 'Descartes', color: '#f59e0b', era: 'Moderna' },
          { key: 'spinoza', name: 'Spinoza', color: '#f59e0b', era: 'Moderna' },
          { key: 'leibniz', name: 'Leibniz', color: '#f59e0b', era: 'Moderna' },
          { key: 'hobbes', name: 'Hobbes', color: '#f59e0b', era: 'Moderna' },
          { key: 'locke', name: 'Locke', color: '#f59e0b', era: 'Moderna' },
          { key: 'berkeley', name: 'Berkeley', color: '#f59e0b', era: 'Moderna' },
          { key: 'hume', name: 'Hume', color: '#f59e0b', era: 'Moderna' },
          { key: 'husserl', name: 'Husserl', color: '#10b981', era: 'Contemporánea' },
          { key: 'heidegger', name: 'Heidegger', color: '#10b981', era: 'Contemporánea' },
          { key: 'kant', name: 'Kant', color: '#10b981', era: 'Contemporánea' },
          { key: 'comte', name: 'Comte', color: '#10b981', era: 'Contemporánea' },
          { key: 'nietzsche', name: 'Nietzsche', color: '#10b981', era: 'Contemporánea' },
          { key: 'weber', name: 'Max Weber', color: '#10b981', era: 'Contemporánea' }
        ];

        // Construir panel derecho
        let htmlPanel = `<div class="philosopher-card" style="border-color: #f43f5e;"><strong>Premisa Analizada:</strong> "${premisa}"</div>`;
        
        listaFilosofos.forEach(f => {
          const texto = data[f.key] || 'Sin datos.';
          htmlPanel += `
            <div class="philosopher-card" style="border-color: ${f.color};">
              <strong>${f.name}:</strong>
              ${f.name}: ${texto}
            </div>`;
        });

        document.getElementById('taskContent').innerHTML = htmlPanel;

        // Construir Nodos
        const rawNodes = [
          { id: 1, label: 'PREMISA:\n' + acortarTextoNodo(premisa, 30), title: formatearTooltip("Premisa:\n" + premisa), color: { background: '#f43f5e', border: '#fda4af' }, shape: 'box', margin: 12 }
        ];

        const rawEdges = [];

        listaFilosofos.forEach((f, idx) => {
          const idNodo = idx + 2;
          const respuesta = data[f.key] || '';
          rawNodes.push({
            id: idNodo,
            label: `${f.name}\n(${f.era})`,
            title: formatearTooltip(respuesta),
            color: f.color
          });
          rawEdges.push({ from: 1, to: idNodo });
        });

        const nodes = new vis.DataSet(rawNodes);
        const edges = new vis.DataSet(rawEdges);

        const container = document.getElementById('network');
        if (network !== null) { network.destroy(); }

        const options = {
          physics: {
            enabled: true,
            barnesHut: { gravitationalConstant: -38000, centralGravity: 0.1, springLength: 280, springConstant: 0.03 }
          },
          edges: { color: { color: '#38bdf8' }, width: 1.5 },
          interaction: { hover: true }
        };

        network = new vis.Network(container, { nodes, edges }, options);

      } catch (err) {
        console.error("Error al obtener datos:", err);
      }
    }

    window.onload = procesarEpistemologia;
  </script>
</body>
</html>
