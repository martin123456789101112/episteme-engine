<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episteme Engine</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; margin: 0; padding: 20px; position: relative; }
    .author-badge { position: absolute; top: 15px; right: 20px; font-size: 0.8rem; color: #94a3b8; background: #1e293b; padding: 6px 12px; border-radius: 6px; border: 1px solid #334155; }
    h1 { text-align: center; color: #38bdf8; margin: 0 0 5px 0; font-size: 1.8rem; }
    p.subtitle { text-align: center; color: #94a3b8; margin: 0 0 20px 0; font-size: 0.95rem; }
    .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
    input { padding: 12px 16px; width: 420px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
    button { padding: 12px 24px; background: #38bdf8; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #0f172a; }
    .app-layout { display: flex; gap: 15px; width: 100%; height: 75vh; }
    #network { flex: 1; border: 1px solid #334155; border-radius: 8px; background: #0b0f19; height: 100%; }
    .task-panel { width: 380px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .task-panel h2 { color: #38bdf8; font-size: 1.1rem; margin: 0 0 8px 0; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .philosopher-card { background: #0f172a; border-left: 4px solid #38bdf8; padding: 10px 12px; border-radius: 4px; font-size: 0.85rem; line-height: 1.4; }
    .philosopher-card strong { color: #f8fafc; display: block; margin-bottom: 3px; }
    div.vis-tooltip { position: absolute !important; background-color: #1e293b !important; color: #f8fafc !important; border: 1px solid #38bdf8 !important; border-radius: 8px !important; padding: 12px !important; font-size: 0.85rem !important; max-width: 260px !important; z-index: 9999 !important; }
  </style>
</head>
<body>

  <div class="author-badge">sepulveda celeita martin santiago</div>
  <h1>EPISTEME ENGINE</h1>
  <p class="subtitle">Simulador de la Teoría del Conocimiento mediante Nodos Interactivos</p>

  <div class="controls">
    <input type="text" id="userInput" value="Veo una manzana roja en la mesa">
    <button onclick="procesarEpistemologia()">Analizar en Nodos</button>
  </div>

  <div class="app-layout">
    <div id="network"></div>
    <div class="task-panel">
      <h2>Puntos de Vista <span style="font-size: 0.8rem; color: #94a3b8;">(19 Filósofos)</span></h2>
      <div id="taskContent"><p style="color: #94a3b8;">Cargando análisis...</p></div>
    </div>
  </div>

  <script>
    let network = null;

    function formatearTooltip(texto) {
      const container = document.createElement('div');
      container.style.maxWidth = '240px';
      container.style.whiteSpace = 'normal';
      container.style.wordWrap = 'break-word';
      container.innerText = texto || 'Sin interpretación disponible.';
      return container;
    }

    function acortarTextoNodo(str, maxLen = 30) {
      return str.length <= maxLen ? str : str.substring(0, maxLen) + '...';
    }

    function obtenerValor(obj, clave) {
      if (!obj) return 'Análisis no disponible.';
      return obj[clave] || obj[clave.toLowerCase()] || 'Sin datos.';
    }

    async function procesarEpistemologia() {
      const premisa = document.getElementById('userInput').value;

      try {
        const response = await fetch('/api/analizar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ premisa })
        });

        const rawData = await response.json();
        
        // Normalizar llaves a minúsculas y sin tildes
        const data = {};
        Object.keys(rawData).forEach(key => {
          const cleanKey = key.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          data[cleanKey] = rawData[key];
        });

        const taskContent = document.getElementById('taskContent');
        taskContent.innerHTML = `
          <div class="philosopher-card" style="border-color: #f43f5e;"><strong>Premisa Analizada:</strong> "${premisa}"</div>
          <div class="philosopher-card" style="border-color: #38bdf8;"><strong>Sócrates:</strong> ${obtenerValor(data, 'socrates')}</div>
          <div class="philosopher-card" style="border-color: #38bdf8;"><strong>Platón:</strong> ${obtenerValor(data, 'platon')}</div>
          <div class="philosopher-card" style="border-color: #38bdf8;"><strong>Aristóteles:</strong> ${obtenerValor(data, 'aristoteles')}</div>
          <div class="philosopher-card" style="border-color: #a855f7;"><strong>San Agustín:</strong> ${obtenerValor(data, 'agustin')}</div>
          <div class="philosopher-card" style="border-color: #a855f7;"><strong>Duns Escoto:</strong> ${obtenerValor(data, 'escoto')}</div>
          <div class="philosopher-card" style="border-color: #a855f7;"><strong>Guillermo de Ockham:</strong> ${obtenerValor(data, 'ockam')}</div>
          <div class="philosopher-card" style="border-color: #f59e0b;"><strong>Descartes:</strong> ${obtenerValor(data, 'descartes')}</div>
          <div class="philosopher-card" style="border-color: #f59e0b;"><strong>Spinoza:</strong> ${obtenerValor(data, 'spinoza')}</div>
          <div class="philosopher-card" style="border-color: #f59e0b;"><strong>Leibniz:</strong> ${obtenerValor(data, 'leibniz')}</div>
          <div class="philosopher-card" style="border-color: #f59e0b;"><strong>Hobbes:</strong> ${obtenerValor(data, 'hobbes')}</div>
          <div class="philosopher-card" style="border-color: #f59e0b;"><strong>Locke:</strong> ${obtenerValor(data, 'locke')}</div>
          <div class="philosopher-card" style="border-color: #f59e0b;"><strong>Berkeley:</strong> ${obtenerValor(data, 'berkeley')}</div>
          <div class="philosopher-card" style="border-color: #f59e0b;"><strong>Hume:</strong> ${obtenerValor(data, 'hume')}</div>
          <div class="philosopher-card" style="border-color: #10b981;"><strong>Husserl:</strong> ${obtenerValor(data, 'husserl')}</div>
          <div class="philosopher-card" style="border-color: #10b981;"><strong>Heidegger:</strong> ${obtenerValor(data, 'heidegger')}</div>
          <div class="philosopher-card" style="border-color: #10b981;"><strong>Kant:</strong> ${obtenerValor(data, 'kant')}</div>
          <div class="philosopher-card" style="border-color: #10b981;"><strong>Comte:</strong> ${obtenerValor(data, 'comte')}</div>
          <div class="philosopher-card" style="border-color: #10b981;"><strong>Nietzsche:</strong> ${obtenerValor(data, 'nietzsche')}</div>
          <div class="philosopher-card" style="border-color: #10b981;"><strong>Max Weber:</strong> ${obtenerValor(data, 'weber')}</div>
        `;

        const labelCentro = 'PREMISA:\n' + acortarTextoNodo(premisa, 30);

        const nodes = new vis.DataSet([
          { id: 1, label: labelCentro, title: formatearTooltip("Premisa:\n" + premisa), color: { background: '#f43f5e', border: '#fda4af' }, shape: 'box', margin: 12 },
          { id: 2, label: 'Sócrates', title: formatearTooltip(obtenerValor(data, 'socrates')), color: '#38bdf8' },
          { id: 3, label: 'Platón', title: formatearTooltip(obtenerValor(data, 'platon')), color: '#38bdf8' },
          { id: 4, label: 'Aristóteles', title: formatearTooltip(obtenerValor(data, 'aristoteles')), color: '#38bdf8' },
          { id: 5, label: 'San Agustín', title: formatearTooltip(obtenerValor(data, 'agustin')), color: '#a855f7' },
          { id: 6, label: 'Duns Escoto', title: formatearTooltip(obtenerValor(data, 'escoto')), color: '#a855f7' },
          { id: 7, label: 'G. de Ockham', title: formatearTooltip(obtenerValor(data, 'ockam')), color: '#a855f7' },
          { id: 8, label: 'Descartes', title: formatearTooltip(obtenerValor(data, 'descartes')), color: '#f59e0b' },
          { id: 9, label: 'Spinoza', title: formatearTooltip(obtenerValor(data, 'spinoza')), color: '#f59e0b' },
          { id: 10, label: 'Leibniz', title: formatearTooltip(obtenerValor(data, 'leibniz')), color: '#f59e0b' },
          { id: 11, label: 'Hobbes', title: formatearTooltip(obtenerValor(data, 'hobbes')), color: '#f59e0b' },
          { id: 12, label: 'Locke', title: formatearTooltip(obtenerValor(data, 'locke')), color: '#f59e0b' },
          { id: 13, label: 'Berkeley', title: formatearTooltip(obtenerValor(data, 'berkeley')), color: '#f59e0b' },
          { id: 14, label: 'Hume', title: formatearTooltip(obtenerValor(data, 'hume')), color: '#f59e0b' },
          { id: 15, label: 'Husserl', title: formatearTooltip(obtenerValor(data, 'husserl')), color: '#10b981' },
          { id: 16, label: 'Heidegger', title: formatearTooltip(obtenerValor(data, 'heidegger')), color: '#10b981' },
          { id: 17, label: 'Kant', title: formatearTooltip(obtenerValor(data, 'kant')), color: '#10b981' },
          { id: 18, label: 'Comte', title: formatearTooltip(obtenerValor(data, 'comte')), color: '#10b981' },
          { id: 19, label: 'Nietzsche', title: formatearTooltip(obtenerValor(data, 'nietzsche')), color: '#10b981' },
          { id: 20, label: 'Weber', title: formatearTooltip(obtenerValor(data, 'weber')), color: '#10b981' }
        ]);

        const edges = new vis.DataSet([
          { from: 1, to: 2 }, { from: 1, to: 3 }, { from: 1, to: 4 },
          { from: 1, to: 5 }, { from: 1, to: 6 }, { from: 1, to: 7 },
          { from: 1, to: 8 }, { from: 1, to: 9 }, { from: 1, to: 10 },
          { from: 1, to: 11 }, { from: 1, to: 12 }, { from: 1, to: 13 },
          { from: 1, to: 14 }, { from: 1, to: 15 }, { from: 1, to: 16 },
          { from: 1, to: 17 }, { from: 1, to: 18 }, { from: 1, to: 19 },
          { from: 1, to: 20 }
        ]);

        const container = document.getElementById('network');
        if (network !== null) { network.destroy(); }

        const options = {
          physics: {
            enabled: true,
            barnesHut: { gravitationalConstant: -38000, centralGravity: 0.1, springLength: 280, springConstant: 0.03 }
          },
          edges: { color: { color: '#38bdf8' }, width: 1.5 },
          interaction: { hover: true }
        };

        network = new vis.Network(container, { nodes, edges }, options);

      } catch (err) {
        console.error("Error al obtener datos:", err);
      }
    }

    window.onload = procesarEpistemologia;
  </script>
</body>
</html>
